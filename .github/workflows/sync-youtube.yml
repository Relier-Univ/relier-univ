name: Synchroniser les vidéos YouTube

on:
  workflow_dispatch:

  schedule:
    - cron: "20 5 * * *"

  push:
    branches:
      - main
    paths:
      - "videos.html"
      - "assets/js/videos.js"
      - "scripts/sync-youtube.py"
      - ".github/workflows/sync-youtube.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer yt-dlp
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade yt-dlp

      - name: Synchroniser la chaîne RELIER
        run: |
          python scripts/sync-youtube.py

      - name: Enregistrer les changements
        run: |
          git config user.name "RELIER Video Bot"
          git config user.email "actions@users.noreply.github.com"

          git add assets/data/videos.json
          git add assets/img/videos/

          if git diff --cached --quiet; then
            echo "Aucune modification."
            exit 0
          fi

          git commit -m "Mise à jour automatique des vidéos RELIER"
          git push
